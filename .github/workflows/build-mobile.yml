name: JUNAID ABBASI Mobile Build

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
android:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21
  - name: Prepare Capacitor project
    run: |
      npm init -y
      npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7
      mkdir -p www
      rsync -av ./ www/ \
        --exclude='./.git/' \
        --exclude='./.github/' \
        --exclude='./node_modules/' \
        --exclude='./www/' \
        --exclude='./android/' \
        --exclude='./ios/' \
        --exclude='./.gradle/' \
        --exclude='./build/'
      node --input-type=module -e '
      import fs from "node:fs";
      fs.writeFileSync("capacitor.config.json", JSON.stringify({
        appId: "com.junaidabbasi.panel",
        appName: "JUNAID ABBASI",
        webDir: "www"
      }, null, 2));
      '
      npx cap add android
      npx cap sync android
  - name: Build APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: JUNAID-ABBASI-APK
      path: android/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error

ios:
name: Build unsigned iOS IPA
runs-on: macos-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
  - name: Prepare Capacitor project
    run: |
      npm init -y
      npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7
      mkdir -p www
      rsync -av ./ www/ \
        --exclude='./.git/' \
        --exclude='./.github/' \
        --exclude='./node_modules/' \
        --exclude='./www/' \
        --exclude='./android/' \
        --exclude='./ios/' \
        --exclude='./.gradle/' \
        --exclude='./build/'
      node --input-type=module -e '
      import fs from "node:fs";
      fs.writeFileSync("capacitor.config.json", JSON.stringify({
        appId: "com.junaidabbasi.panel",
        appName: "JUNAID ABBASI",
        webDir: "www"
      }, null, 2));
      '
      npx cap add ios
      npx cap sync ios
  - name: Build unsigned iOS application
    run: |
      xcodebuild \
        -project ios/App/App.xcodeproj \
        -scheme App \
        -configuration Release \
        -sdk iphoneos \
        -derivedDataPath build \
        CODE_SIGNING_ALLOWED=NO \
        build
  - name: Package unsigned IPA
    run: |
      mkdir -p Payload
      cp -R build/Build/Products/Release-iphoneos/App.app Payload/
      /usr/bin/zip -r JUNAID-ABBASI-unsigned.ipa Payload
  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: JUNAID-ABBASI-IPA-UNSIGNED
      path: JUNAID-ABBASI-unsigned.ipa
      if-no-files-found: error